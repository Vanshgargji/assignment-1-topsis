<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TOPSIS Web Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .container {
            width: 400px;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input[type="file"],
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #ff9800;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>TOPSIS Web Service</h2>

    <form action="/submit" method="POST" enctype="multipart/form-data">

        <label>Upload CSV File</label>
        <input type="file" name="file" required>

        <label>Weights (comma separated)</label>
        <input type="text" name="weights" placeholder="1,1,1,1" required>

        <label>Impacts (comma separated)</label>
        <input type="text" name="impacts" placeholder="+,-,+,+" required>

        <label>Email ID</label>
        <input type="email" name="email" placeholder="example@gmail.com" required>

        <button type="submit">Submit</button>
    </form>

    <div class="note">
        Note:
        <ul>
            <li>Number of weights must equal number of impacts</li>
            <li>Impacts must be + or -</li>
            <li>Result file will be sent to the given email</li>
        </ul>
    </div>
</div>

</body>
</html>
